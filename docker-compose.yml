services:
  app:
    build: ./app
    working_dir: /app
    ports:
      - "8000:8000"  # Фиксим порты, чтобы Nginx знал, куда проксировать
    volumes:
      - images:/app/images
      - logs:/app/logs
      - backups:/app/backups
      - ./app/static:/app/static
      - ./app/templates:/app/templates
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=images_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    networks:
      - hosting_network
    depends_on:
      db:
        condition: service_healthy
    restart: always

  backup-scheduler:
    build: ./app
    working_dir: /app
    command: python scheduled_backup.py
    volumes:
      - backups:/app/backups
      - logs:/app/logs
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=images_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    networks:
      - hosting_network
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    container_name: imagehoster-nginx
    image: nginx:latest
    command: nginx -g 'daemon off;'
    ports:
      - "8080:80"  # Фиксим порты, чтобы Nginx был доступен на 8080
    volumes:
      - ./app/nginx.conf:/etc/nginx/nginx.conf:ro
      - images:/app/images  # Фиксим volume, чтобы Nginx видел файлы
      - ./app/static:/app/static
    networks:
      - hosting_network
    depends_on:
      app:
        condition: service_started
    restart: always

  db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=images_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql
      - backups:/backups
    networks:
      - hosting_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

networks:
  hosting_network:
    driver: bridge

volumes:
  images:
  logs:
  backups:
  db_data: